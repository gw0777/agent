name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  syntax-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Node 문법 검사
        run: |
          for f in *.js; do
            echo "checking $f"
            node --check "$f"
          done

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python 문법 검사
        run: python -m py_compile gpt-bridge-server/server.py
